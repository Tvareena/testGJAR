// Fixed game vocabulary. The order of COLORS is the bit order used by matching (red = bit 0 ... white = bit 5).
const COLORS = ['red', 'blue', 'yellow', 'green', 'violet', 'white'];
const SHAPES = ['pebble', 'stick', 'cylinder', 'ring', 'shard'];
const SEGMENT_OPTIONS = [4, 6, 8, 12];

/**
 * Parse a crystal type string such as "red-pebble".
 * @param {unknown} s
 * @returns {{color: string, shape: string} | null}
 */
function parseCrystalType(s) {
  if (typeof s !== 'string') return null;
  const i = s.indexOf('-');
  if (i < 0) return null;
  const color = s.slice(0, i);
  const shape = s.slice(i + 1);
  if (!COLORS.includes(color) || !SHAPES.includes(shape)) return null;
  return { color, shape };
}

__exp.SHAPES = SHAPES;

// Game flow (T25): Title -> [scene before] -> Puzzle (+ Activating) -> [scene after] -> next spell ... -> End.
// States follow the TDD diagram: Boot, Title, Story, Puzzle, Activating, End, Author. Activating lives inside
// the puzzle scene (the casting ceremony overlays the puzzle screen, Phase 5).

function createFlow(game) {
  const levels = () => game.data.levels;

  /** Play a story scene, then continue. Skipped with ?nostory or when the scene id is empty. */
  function story(sceneId, next) {
    if (!sceneId || game.flags.nostory) { next(); return; }
    game.go('story', { sceneId, next });
  }

  function playLevel(i) {
    story(levels()[i].sceneBefore, () => game.go('puzzle', { levelIndex: i }));
  }

  return {
    toTitle() {
      game.go('title');
    },

    newGame() {
      for (const k of Object.keys(game.results)) delete game.results[k];
      playLevel(0);
    },

    /** Called when the player dismisses a successful activation. */
    levelPassed(i) {
      story(levels()[i].sceneAfter, () => {
        if (i + 1 < levels().length) playLevel(i + 1);
        else game.go('end');
      });
    },
  };
}

__exp.createFlow = createFlow;

// Fixed 1920 x 1080 design space, scaled to fit the window with letterbox bars (T02).

const DESIGN_H = 1080;
const MAX_DPR = 2;

 * @param {HTMLCanvasElement} canvas

    scale: 1,      // design px -> CSS px
    offsetX: 0,    // CSS px from window left to design origin
    offsetY: 0,
    dpr: 1,
    cssW: 0,
    cssH: 0,
    /** @type {null | (() => void)} */
    onResize: null,
  };

  function resize() {
    const vv = window.visualViewport;
    const w = Math.round(vv ? vv.width : window.innerWidth);
    const h = Math.round(vv ? vv.height : window.innerHeight);
    const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

    canvas.style.width = `${w}px`;
    canvas.style.height = `${h}px`;
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));

    const scale = Math.min(w / DESIGN_W, h / DESIGN_H);
    layout.scale = scale;
    layout.offsetX = (w - DESIGN_W * scale) / 2;
    layout.offsetY = (h - DESIGN_H * scale) / 2;
    layout.dpr = dpr;
    layout.cssW = w;
    layout.cssH = h;
    layout.onResize?.();
  }

  /** Clear to letterbox black, then set the transform so drawing uses design px, clipped to the design area. */
  layout.begin = (/** @type {CanvasRenderingContext2D} */ ctx) => {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const k = layout.dpr * layout.scale;
    ctx.setTransform(k, 0, 0, k, layout.dpr * layout.offsetX, layout.dpr * layout.offsetY);
    ctx.beginPath();
    ctx.rect(0, 0, DESIGN_W, DESIGN_H);
    ctx.clip();
  };

  /** Convert a pointer's client coordinates to design-space coordinates. */
  layout.toDesign = (/** @type {number} */ clientX, /** @type {number} */ clientY) => {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left - layout.offsetX) / layout.scale,
      y: (clientY - r.top - layout.offsetY) / layout.scale,
    };
  };

  layout.isPortrait = () => layout.cssH > layout.cssW;

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 50));
  window.visualViewport?.addEventListener('resize', resize);
  resize();
  return layout;
}
