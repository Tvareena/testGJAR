<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Kaleidoscope Spellcasting</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
    #file-warning {
      display: none;
      color: #eee;
      font: 18px/1.5 system-ui, sans-serif;
      padding: 32px;
      max-width: 640px;
    }
    #file-warning code { background: #222; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="file-warning">
    <p><strong>This game must be served over HTTP.</strong></p>
    <p>Opening <code>index.html</code> directly from disk blocks JavaScript modules and data loading.
       In this folder run <code>python -m http.server 8000</code> and open
       <code>http://localhost:8000</code>.</p>
  </div>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('game').style.display = 'none';
      document.getElementById('file-warning').style.display = 'block';
    }
  </script>
  <!-- Bump ?v= together with src/version.js on every deploy so browsers fetch the new code. -->
  <script type="module" src="src/main.js?v=1.0.0"></script>
</body>
</html>
